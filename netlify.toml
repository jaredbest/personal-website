# Netlify build settings. These override the settings in the Netlify UI.
[build]
  command = "npm run build"
  publish = "dist"

# The build needs Node 22 or newer (see "engines" in package.json).
[build.environment]
  NODE_VERSION = "22"

# Send every path to the app so deep links like /resume work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The script hash allows the one inline script in index.html;
# src/test/headers.test.ts fails if that script changes and the hash is not updated.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-hyaQh9DGdV7vGIEUM7TLsVXSBd5ZqYqe4Jp47lhnXG4='; style-src 'self'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built files have a content hash in their name, so they never change and can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
